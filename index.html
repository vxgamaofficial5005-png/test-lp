<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محرر بيانات EXIF و GPS للصور</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- مكتبة Piexifjs للتعامل مع EXIF و GPS -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap');
    * {
      font-family: 'Tajawal', sans-serif;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div class="w-full max-w-3xl">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
        محرر بيانات Metadata & EXIF & GPS
      </h1>
      <p class="text-slate-400 mt-1 text-xs md:text-sm">
        عدل معلومات الكاميرا، التاريخ، أو موقع الصورة الجغرافي (GPS) بكل سهولة.
      </p>
    </header>

    <!-- Upload Zone -->
    <div id="dropZone" class="border-2 border-dashed border-indigo-500/40 hover:border-indigo-500 transition rounded-2xl p-6 text-center cursor-pointer bg-slate-800/60 mb-6">
      <input type="file" id="imageInput" accept="image/jpeg, image/jpg" class="hidden">
      <div class="flex flex-col items-center justify-center pointer-events-none">
        <svg class="w-12 h-12 text-indigo-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="text-base font-bold text-slate-200">اضغط هنا لاختيار صورة من هاتفك</span>
        <span class="text-xs text-slate-400 mt-1">يدعم فقط صيغ JPG / JPEG</span>
      </div>
    </div>

    <!-- مكان التعديل -->
    <div id="editorArea" class="hidden space-y-5">
      
      <!-- Preview -->
      <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4">
        <div class="w-full h-56 rounded-xl overflow-hidden bg-slate-950 flex items-center justify-center border border-slate-700/50">
          <img id="imagePreview" src="" alt="Preview" class="max-h-full max-w-full object-contain">
        </div>
        <div id="fileInfo" class="mt-2 text-xs text-slate-400 text-center"></div>
      </div>

      <!-- خانات التعديل -->
      <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
        
        <!-- قسم الـ GPS / اللوكاليزاسيون -->
        <div class="bg-indigo-950/40 border border-indigo-500/30 p-4 rounded-xl">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-indigo-300 flex items-center gap-1.5">
              <span>📍</span> موقع الصورة الجغرافي (GPS Location)
            </h3>
            <button type="button" id="getCurrentLocBtn" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
              موقعي الحالي
            </button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">خط العرض (Latitude)</label>
              <input type="number" step="any" id="latInput" placeholder="مثال: 33.5731" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none text-left" dir="ltr">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">خط الطول (Longitude)</label>
              <input type="number" step="any" id="lngInput" placeholder="مثال: -7.5898" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none text-left" dir="ltr">
            </div>
          </div>
          <p class="text-[11px] text-slate-400 mt-2">
            * يمكنك كتابة الإحداثيات مباشرة أو الضغط على "موقعي الحالي". اتركها فارغة لحذف الموقع من الصورة.
          </p>
        </div>

        <!-- معلومات الكاميرا والتاريخ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">المصور / الكاتب (Artist)</label>
            <input type="text" id="artistInput" placeholder="اسم المصور" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">حقوق النشر (Copyright)</label>
            <input type="text" id="copyrightInput" placeholder="© 2026 حقوق النشر" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">ماركة الجهاز (Make)</label>
            <input type="text" id="makeInput" placeholder="Apple, Samsung, Canon..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">موديل الجهاز (Model)</label>
            <input type="text" id="modelInput" placeholder="iPhone 15, Galaxy S24..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">تاريخ الالتقاط (YYYY:MM:DD HH:MM:SS)</label>
            <input type="text" id="dateInput" placeholder="2026:05:14 15:30:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none text-left" dir="ltr">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">البرنامج (Software)</label>
            <input type="text" id="softwareInput" placeholder="Photoshop, Lightroom..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <!-- أزرار الحفظ والمسح -->
        <div class="mt-5 pt-4 border-t border-slate-700 flex flex-col gap-2">
          <button id="saveBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2 text-sm">
            حفظ وتنزيل الصورة بالتعديلات الجديدة
          </button>
          
          <button id="stripBtn" class="w-full py-2.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-600/40 rounded-xl font-medium transition text-xs flex items-center justify-center gap-2">
            مسح جميع البيانات والـ GPS كلياً (Clean Photo)
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- إشعار عند الحفظ -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-indigo-500 text-indigo-300 px-4 py-2 rounded-full text-xs font-medium shadow-2xl opacity-0 transition duration-300 pointer-events-none z-50"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const imageInput = document.getElementById('imageInput');
    const editorArea = document.getElementById('editorArea');
    const imagePreview = document.getElementById('imagePreview');
    const fileInfo = document.getElementById('fileInfo');

    const latInput = document.getElementById('latInput');
    const lngInput = document.getElementById('lngInput');
    const getCurrentLocBtn = document.getElementById('getCurrentLocBtn');

    const artistInput = document.getElementById('artistInput');
    const copyrightInput = document.getElementById('copyrightInput');
    const makeInput = document.getElementById('makeInput');
    const modelInput = document.getElementById('modelInput');
    const softwareInput = document.getElementById('softwareInput');
    const dateInput = document.getElementById('dateInput');

    const saveBtn = document.getElementById('saveBtn');
    const stripBtn = document.getElementById('stripBtn');
    const toast = document.getElementById('toast');

    let currentDataUrl = '';
    let currentFileName = 'image.jpg';
    let currentExif = null;

    function notify(msg) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    dropZone.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.match('image/jpeg')) {
        alert('المرجو اختيار صورة بصيغة JPG أو JPEG');
        return;
      }

      currentFileName = file.name;
      const reader = new FileReader();

      reader.onload = function(e) {
        currentDataUrl = e.target.result;
        imagePreview.src = currentDataUrl;
        fileInfo.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

        try {
          currentExif = piexif.load(currentDataUrl);
          populateFields(currentExif);
        } catch (err) {
          currentExif = { "0th": {}, "Exif": {}, "GPS": {}, "Interop": {}, "1st": {}, "thumbnail": null };
          clearInputs();
        }

        editorArea.classList.remove('hidden');
        dropZone.classList.add('hidden');
        notify("تم تحميل بيانات الصورة والـ GPS بنجاح!");
      };

      reader.readAsDataURL(file);
    }

    // دوال تحويل الـ GPS بين الدرجات العادية و DMS الخاص بـ EXIF
    function degToDmsRational(deg) {
      const absolute = Math.abs(deg);
      const degrees = Math.floor(absolute);
      const minutesNotTruncated = (absolute - degrees) * 60;
      const minutes = Math.floor(minutesNotTruncated);
      const seconds = Math.round((minutesNotTruncated - minutes) * 60 * 100);
      return [[degrees, 1], [minutes, 1], [seconds, 100]];
    }

    function dmsRationalToDeg(dms, ref) {
      if (!dms || dms.length < 3) return '';
      const d = dms[0][0] / dms[0][1];
      const m = dms[1][0] / dms[1][1];
      const s = dms[2][0] / dms[2][1];
      let deg = d + m / 60 + s / 3600;
      if (ref === 'S' || ref === 'W') deg = -deg;
      return deg.toFixed(6);
    }

    function populateFields(exif) {
      clearInputs();
      if (!exif) return;

      const zeroth = exif["0th"] || {};
      const exifSub = exif["Exif"] || {};
      const gps = exif["GPS"] || {};

      if (zeroth[piexif.ImageIFD.Artist]) artistInput.value = zeroth[piexif.ImageIFD.Artist];
      if (zeroth[piexif.ImageIFD.Copyright]) copyrightInput.value = zeroth[piexif.ImageIFD.Copyright];
      if (zeroth[piexif.ImageIFD.Make]) makeInput.value = zeroth[piexif.ImageIFD.Make];
      if (zeroth[piexif.ImageIFD.Model]) modelInput.value = zeroth[piexif.ImageIFD.Model];
      if (zeroth[piexif.ImageIFD.Software]) softwareInput.value = zeroth[piexif.ImageIFD.Software];
      if (exifSub[piexif.ExifIFD.DateTimeOriginal]) dateInput.value = exifSub[piexif.ExifIFD.DateTimeOriginal];

      // قراءة الـ GPS إذا كان موجود
      if (gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLatitudeRef]) {
        latInput.value = dmsRationalToDeg(gps[piexif.GPSIFD.GPSLatitude], gps[piexif.GPSIFD.GPSLatitudeRef]);
      }
      if (gps[piexif.GPSIFD.GPSLongitude] && gps[piexif.GPSIFD.GPSLongitudeRef]) {
        lngInput.value = dmsRationalToDeg(gps[piexif.GPSIFD.GPSLongitude], gps[piexif.GPSIFD.GPSLongitudeRef]);
      }
    }

    function clearInputs() {
      artistInput.value = '';
      copyrightInput.value = '';
      makeInput.value = '';
      modelInput.value = '';
      softwareInput.value = '';
      dateInput.value = '';
      latInput.value = '';
      lngInput.value = '';
    }

    // زر جلب الموقع الحالي من متصفح الهاتف
    getCurrentLocBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("المتصفح لا يدعم تحديد الموقع!");
        return;
      }
      notify("جاري تحديد موقعك...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          latInput.value = pos.coords.latitude.toFixed(6);
          lngInput.value = pos.coords.longitude.toFixed(6);
          notify("تم تحديد موقعك بنجاح!");
        },
        (err) => {
          alert("تعذر جلب الموقع: يرجى تفعيل الـ GPS في الهاتف والسماح للمتصفح بالوصول إليه.");
        }
      );
    });

    // حفظ التعديلات
    saveBtn.addEventListener('click', () => {
      if (!currentDataUrl) return;

      try {
        if (!currentExif) {
          currentExif = { "0th": {}, "Exif": {}, "GPS": {}, "Interop": {}, "1st": {}, "thumbnail": null };
        }
        if (!currentExif["0th"]) currentExif["0th"] = {};
        if (!currentExif["Exif"]) currentExif["Exif"] = {};
        if (!currentExif["GPS"]) currentExif["GPS"] = {};

        // حفظ البيانات النصية
        if (artistInput.value.trim()) currentExif["0th"][piexif.ImageIFD.Artist] = artistInput.value.trim();
        if (copyrightInput.value.trim()) currentExif["0th"][piexif.ImageIFD.Copyright] = copyrightInput.value.trim();
        if (makeInput.value.trim()) currentExif["0th"][piexif.ImageIFD.Make] = makeInput.value.trim();
        if (modelInput.value.trim()) currentExif["0th"][piexif.ImageIFD.Model] = modelInput.value.trim();
        if (softwareInput.value.trim()) currentExif["0th"][piexif.ImageIFD.Software] = softwareInput.value.trim();
        if (dateInput.value.trim()) currentExif["Exif"][piexif.ExifIFD.DateTimeOriginal] = dateInput.value.trim();

        // حفظ الـ GPS
        const lat = parseFloat(latInput.value);
        const lng = parseFloat(lngInput.value);

        if (!isNaN(lat) && !isNaN(lng)) {
          currentExif["GPS"][piexif.GPSIFD.GPSLatitudeRef] = lat >= 0 ? 'N' : 'S';
          currentExif["GPS"][piexif.GPSIFD.GPSLatitude] = degToDmsRational(lat);
          currentExif["GPS"][piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? 'E' : 'W';
          currentExif["GPS"][piexif.GPSIFD.GPSLongitude] = degToDmsRational(lng);
        } else if (latInput.value.trim() === '' && lngInput.value.trim() === '') {
          // مسح الـ GPS إذا كانت الخانات فارغة
          currentExif["GPS"] = {};
        }

        const exifBytes = piexif.dump(currentExif);
        const newImageDataUrl = piexif.insert(exifBytes, currentDataUrl);

        downloadImage(newImageDataUrl, `modified_${currentFileName}`);
        notify("تم حفظ الإحداثيات والبيانات بنجاح!");
      } catch (err) {
        alert("خطأ أثناء حفظ البيانات: " + err.message);
      }
    });

    // مسح كل شيء
    stripBtn.addEventListener('click', () => {
      if (!currentDataUrl) return;
      try {
        const cleanedDataUrl = piexif.remove(currentDataUrl);
        clearInputs();
        downloadImage(cleanedDataUrl, `cleaned_${currentFileName}`);
        notify("تم مسح الـ EXIF والـ GPS بالكامل!");
      } catch (err) {
        alert("خطأ: " + err.message);
      }
    });

    function downloadImage(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
